<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Thank You - Digital Message</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eaf6ff;
            color: #222;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .thank-you-card {
            background: white;
            max-width: 550px;
            width: 100%;
            padding: 40px 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .thank-you-card h1 {
            margin-bottom: 20px;
        }

        .thank-you-card p {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .home-button {
            display: inline-block;
            background: #222;
            color: white;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: bold;
        }

        .home-button:hover {
            background: #00bcd4;
        }
    </style>
</head>

<body>

    <div class="thank-you-card">

        <h1>Thank You! ✅</h1>

        <p>
            Your order request has been received successfully.
        </p>

        <p>
            We will review your requirements and confirm
            the final price before starting the work.
        </p>

        <a class="home-button" href="index.html">
            Back to Home
        </a>

    </div>

</body>

</html>
